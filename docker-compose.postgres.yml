# PostgreSQL Docker Setup for TypeORM & Prisma Demos
# Usage: docker-compose -f docker-compose.postgres.yml up -d

version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres-course
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: course_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - postgres-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # pgAdmin - Database Admin UI (optional)
  pgadmin:
    image: dpage/pgadmin4:8
    container_name: pgadmin-course
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - postgres-network

volumes:
  postgres_data:
    name: postgres-course-data
  pgadmin_data:
    name: pgadmin-course-data

networks:
  postgres-network:
    name: postgres-course-network
    driver: bridge
