# MongoDB Docker Setup for Course Demos
# Usage: docker-compose -f docker-compose.mongodb.yml up -d

version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: mongodb-course
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: course_db
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - mongodb-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # MongoDB Express - Web-based Admin UI (optional)
  mongo-express:
    image: mongo-express:1.0.0
    container_name: mongo-express-course
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: password123
      ME_CONFIG_MONGODB_URL: mongodb://admin:password123@mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin123
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - mongodb-network

volumes:
  mongodb_data:
    name: mongodb-course-data
  mongodb_config:
    name: mongodb-course-config

networks:
  mongodb-network:
    name: mongodb-course-network
    driver: bridge
