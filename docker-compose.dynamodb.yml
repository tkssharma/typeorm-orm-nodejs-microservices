# DynamoDB Local Docker Setup for Course Demos
# Usage: docker-compose -f docker-compose.dynamodb.yml up -d

version: '3.8'

services:
  dynamodb-local:
    image: amazon/dynamodb-local:2.0.0
    container_name: dynamodb-local-course
    restart: unless-stopped
    ports:
      - "8000:8000"
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal/data"
    volumes:
      - dynamodb_data:/home/dynamodblocal/data
    working_dir: /home/dynamodblocal
    networks:
      - dynamodb-network
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # DynamoDB Admin UI (optional)
  dynamodb-admin:
    image: aaronshaf/dynamodb-admin:4.6.1
    container_name: dynamodb-admin-course
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      DYNAMO_ENDPOINT: http://dynamodb-local:8000
      AWS_REGION: local
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    depends_on:
      - dynamodb-local
    networks:
      - dynamodb-network

volumes:
  dynamodb_data:
    name: dynamodb-course-data

networks:
  dynamodb-network:
    name: dynamodb-course-network
    driver: bridge
